# https://github.com/Mattraks/delete-workflow-runs
# https://docs.github.com/en/rest/actions/workflows?apiVersion=2022-11-28#create-a-workflow-dispatch-event

name: Main workflow

on:
  workflow_dispatch: # Manual trigger

jobs:
  main-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run custom action
        run: |
          echo "------------- pwd"
          pwd
          echo "------------- go"
          cd go
          wget -q "https://go.dev/dl/go1.27.1.linux-amd64.tar.gz"
          tar -xf "go1.27.1.linux-amd64.tar.gz"
          rm -rf "go1.27.1.linux-amd64.tar.gz"
          export PATH=$PATH:/home/runner/work/test/test/goo/go/bin
          cd ..
          go mod download
          GOAMD64=v3 CGO_ENABLED=0 go build --ldflags="-s -w" -o doit
          chmod +x doit
          ./doit
          echo "------------- ifconfig.net"
          curl \
            --silent \
            --show-error \
            https://ifconfig.net
          echo "------------- whoami"
          whoami
          echo "------------- ls -la"
          ls -la
          # echo "-------------"
          # curl -o libnode.so https://cdn.alt-mp.com/js-module/release/x64_linux/modules/js-module/libnode.so
          echo "------------- free -h"
          free -h
          echo "------------- nproc"
          nproc
          echo "------------- fdisk -l"
          fdisk -l
          echo "------------- lsblk"
          lsblk
          echo "-------------"
          sleep 30m

      - name: Trigger workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LOOP }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref": "main"}' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto.yml/dispatches
